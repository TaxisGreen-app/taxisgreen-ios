name: Build iOS & App Store Connect

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Sélection de la version stable de Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dépendances Capacitor
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>TaxisGreen</title>
              <script>
                window.location.replace("https://app.taxisgreen.com");
              </script>
            </head>
            <body style="margin: 0; background-color: #0b1510;"></body>
          </html>
          EOF
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "TaxisGreen" "com.taxisgreen.app" --web-dir "www"
          npx cap add ios

      - name: Configuration de l'icône et des autorisations iOS
        run: |
          curl -s -L -o app-icon.png https://app.taxisgreen.com/favicon-512.png
          python3 -c "
          import os, urllib.request
          from PIL import Image
          try:
              im = Image.open('app-icon.png').convert('RGBA')
              sizes = [20, 29, 40, 58, 60, 76, 80, 87, 120, 152, 167, 180, 1024]
              icon_dir = 'ios/App/App/Assets.xcassets/AppIcon.appiconset'
              os.makedirs(icon_dir, exist_ok=True)
              for s in sizes:
                  resized = im.resize((s, s), Image.Resampling.LANCZOS)
                  resized.save(f'{icon_dir}/icon_{s}.png')
          except Exception as e:
              print('Icon resize note:', e)
          " || true

          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'TaxisGreen utilise votre géolocalisation pour proposer des courses et faciliter la prise en charge.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'TaxisGreen utilise votre géolocalisation en arrière-plan pour le suivi des courses.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'TaxisGreen nécessite l accès à l appareil photo pour photographier les documents professionnels.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'TaxisGreen nécessite l accès à la galerie pour importer vos documents professionnels.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true

      - name: Synchronisation Capacitor
        run: npx cap sync ios

      - name: Configuration de Fastlane
        run: |
          mkdir -p ios/App/fastlane
          cat << 'EOF' > ios/App/fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Signature et envoi vers App Store Connect"
            lane :release do
              team_id = ENV["APPLE_TEAM_ID"]

              api_key = app_store_connect_api_key(
                key_id: ENV["APPSTORE_KEY_ID"],
                issuer_id: ENV["APPSTORE_ISSUER_ID"],
                key_content: ENV["APPSTORE_PRIVATE_KEY"],
                duration: 1200,
                in_house: false
              )

              kc_name = "ci_keychain"
              kc_pass = "taxisgreen_ci_pass"
              create_keychain(
                name: kc_name,
                password: kc_pass,
                default_keychain: true,
                unlock: true,
                timeout: 3600,
                lock_when_sleeps: false
              )

              kc_path = Dir.glob(File.expand_path("~/Library/Keychains/#{kc_name}*")).first

              get_certificates(
                api_key: api_key,
                generate_apple_certs: true,
                keychain_path: kc_path,
                keychain_password: kc_pass
              )

              get_provisioning_profile(
                api_key: api_key,
                app_identifier: "com.taxisgreen.app",
                filename: "embedded.mobileprovision"
              )

              update_project_team(
                path: "App.xcodeproj",
                teamid: team_id
              )

              update_project_provisioning(
                xcodeproj: "App.xcodeproj",
                profile: "./embedded.mobileprovision",
                build_configuration: "Release"
              )

              profile_uuid = lane_context[SharedValues::SIGH_UDID]

              build_app(
                project: "App.xcodeproj",
                scheme: "App",
                clean: true,
                output_directory: "./build",
                output_name: "TaxisGreen.ipa",
                export_method: "app-store",
                export_options: {
                  signingStyle: "manual",
                  provisioningProfiles: {
                    "com.taxisgreen.app" => profile_uuid
                  }
                },
                xcargs: "CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER=#{profile_uuid} DEVELOPMENT_TEAM=#{team_id}"
              )

              upload_to_app_store(
                api_key: api_key,
                ipa: "./build/TaxisGreen.ipa",
                skip_screenshots: true,
                skip_metadata: true,
                force: true
              )
            end
          end
          EOF

      - name: Signature et envoi vers App Store Connect
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App
          bundle exec fastlane release || fastlane release

      - name: Sauvegarde du fichier IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TaxisGreen-iOS-IPA
          path: ios/App/build/TaxisGreen.ipa
          if-no-files-found: ignore
